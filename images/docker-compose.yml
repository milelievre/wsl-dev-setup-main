# Compose central pour toutes les images utilitaires du projet.
#
# Utilisation depuis la racine du repo :
#   docker compose -f images/docker-compose.yml build
#   docker compose -f images/docker-compose.yml run --rm powershell <commande>
#
# Le script tests/run-tests.sh encapsule les invocations courantes.

services:
  powershell:
    build:
      context: ./powershell
      dockerfile: Dockerfile
    image: wsl-dev-setup/powershell:latest
    working_dir: /repo
    volumes:
      # Le repo entier est monté en lecture seule pour analyse statique.
      - ../:/repo:ro
